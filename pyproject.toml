[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subkit"
version = "0.1.0"
description = "Pre-submission self-check and acceptance verification kit"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "2023108610260" }]
dependencies = []

[project.scripts]
subkit = "subkit.cli:main"

[tool.setuptools]
packages = ["subkit"]
